name: Update Google reviews

# Pulls the newest Google reviews + rating/count into public/reviews.json.
# Runs once per day at 04:15 UTC (≈ 05:15/06:15 Belgrade time), right after the
# updater itself changes on main, and on demand from the Actions tab via "Run workflow".
on:
  schedule:
    - cron: '15 4 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update-reviews.mjs'
      - '.github/workflows/update-reviews.yml'
  workflow_dispatch:

permissions:
  contents: write  # needed to commit reviews.json back to main

concurrency:
  group: update-reviews

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch newest reviews + rating/count from SerpAPI
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: node scripts/update-reviews.mjs

      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain public/reviews.json)" ]; then
            echo "No changes to reviews.json — nothing to commit."
            exit 0
          fi
          git config user.name  "predator-review-bot"
          git config user.email "noreply@github.com"
          git add public/reviews.json
          git commit -m "chore(reviews): auto-update Google reviews ($(date -u +%Y-%m-%d))"
          git push
